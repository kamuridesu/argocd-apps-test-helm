# Argo CD ships a wildcard "default" AppProject out of the box (sourceRepos/destinations "*").
# apps/default.yml (the literal bootstrap Application ansible-oracle-k3s applies directly, before
# any AppProject from this repo exists to reference) has to stay on "default" since it's the seed
# that syncs root/ - which is exactly what creates the rest of these AppProjects, including this
# override. This tightens "default" down to only what that one bootstrap Application actually
# needs: create the handful of platform-owned Applications/ApplicationSets under root/templates/.
# Everything else uses one of the purpose-scoped projects (platform/observability/secrets/workloads).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/kamuridesu/argocd-apps-test-helm.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
