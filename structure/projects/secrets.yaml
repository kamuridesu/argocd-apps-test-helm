# External Secrets objects live alongside whatever app needs them, so this project spans every
# workload namespace by design. Safety comes from the resource whitelist instead of the
# destination list: this project can only create ExternalSecret/SecretStore-family objects - it
# cannot create a Deployment, a Role, or anything else, even in a namespace it's allowed into.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: secrets
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/kamuridesu/argocd-k3s-secrets.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceWhitelist:
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: PushSecret
