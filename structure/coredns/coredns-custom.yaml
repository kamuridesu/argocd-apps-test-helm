apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  internal.server: |
    internal.kamuridesu.com:53 {
        template IN A {
            match "^.*\.internal\.kamuridesu\.com\.$"
            answer "{{ .Name }} 60 IN A 11.0.0.71"
        }
        template IN AAAA {
            match "^.*\.internal\.kamuridesu\.com\.$"
        }
    }
