cilium:
  ipam:
    mode: kubernetes
  kubeProxyReplacement: true
  # "auto" resolves the local API server instead of a hardcoded per-environment IP - keeps this
  # identical to what ansible-oracle-k3s bootstraps the release with (roles/master/tasks/cilium.yml),
  # so ArgoCD adopting/reconciling the release doesn't change its effective config.
  k8sServiceHost: "auto"
  k8sServicePort: 6443
  operator:
    replicas: 1
  gatewayAPI:
    enabled: true
  ingressController:
    enabled: false
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
