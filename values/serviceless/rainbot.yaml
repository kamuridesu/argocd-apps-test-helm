enabled: true
image:
  repository: ghcr.io/kamuridesu/rainbot
version: "0.13.11"
replicas: 1
language: go
environment: prod
monitoring:
  datadog:
    enabled: true
envFrom:
  - secretRef:
      name: serviceless-rainbot-secret
env:
  - name: GOMAXPROCS
    value: "1"

readinessProbe:
  enabled: true
  probes:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5
livenessProbe:
  enabled: true
  probes:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 10

resources:
  limits:
    memory: 0.5G
  requests:
    cpu: 0.1
    memory: 0.3G

service:
  headless: false

extraContainers:
  - name: wg-gateway
    image: alpine:3.20
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        apk add --no-cache wireguard-tools
        wg-quick up /etc/wireguard/wg0.conf
        while true; do
          sleep 30
          wg show wg0 > /dev/null 2>&1 || wg-quick up /etc/wireguard/wg0.conf
        done
    securityContext:
      capabilities:
        add: ["NET_ADMIN"]
    volumeMounts:
      - name: wg-config
        mountPath: /etc/wireguard
        readOnly: true

volumes:
  - name: wg-config
    secret:
      secretName: serviceless-rainbot-wg-secret
      defaultMode: 0400
