enabled: true
image:
  repository: triliumnext/trilium
version: "v0.104.1"
replicas: 1
language: node-js
environment: prod

envFrom:
  - secretRef:
      name: trilium-config

livenessProbe:
  enabled: true
  probes:
    httpGet:
      path: /api/health-check
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 2
readinessProbe:
  enabled: true
  probes:
    httpGet:
      path: /api/health-check
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 2

resources:
  limits:
    cpu: "0.09"
    memory: 400Mi
  requests:
    cpu: "0.05"
    memory: 200Mi

volumeMounts:
  - mountPath: /home/node/trilium-data
    name: trilium-data

volumeClaimTemplates: # This tells the chart to generate a StatefulSet
  - metadata:
      name: trilium-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-storage
      resources:
        requests:
          storage: 1Gi

service:
  port: 8080

persistentVolume:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  local:
    path: /trilium-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-node

route:
  enabled: true
  hosts:
    - host: notes.kamuridesu.com
      paths:
        - path: /
          pathType: PathPrefix
